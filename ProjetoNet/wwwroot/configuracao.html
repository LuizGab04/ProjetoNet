<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Fabrica de Software | Configuração Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #00AEEF, #4FC3F7);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .profile-container {
            position: relative;
            text-align: center;
        }

        .profile-pic {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 4px solid #fff;
        }

            .profile-pic img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .edit-icon {
            position: absolute;
            bottom: 20px;
            right: calc(50% - 70px);
            background: #fff;
            border-radius: 50%;
            padding: 8px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .profile-name {
            margin-top: 20px;
            font-weight: bold;
            color: #fff;
        }

        #inputFoto {
            display: none;
        }

        .btn-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: background 0.3s;
        }

            .btn-voltar:hover {
                background: #f0f0f0;
            }
    </style>
</head>

<body>
    <main>
        <a href="kanban.html" class="btn-voltar">
            <i class="bi bi-arrow-left-circle"></i>
        </a>
        <div class="profile-container">
            <div class="profile-pic" id="fotoUsuario">
                <!-- Foto aqui -->
                <img id="fotoImg" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Foto Perfil">
            </div>

            <label class="edit-icon" for="inputFoto">
                ✏️
            </label>
            <input type="file" id="inputFoto" accept="image/*" />
            <p class="profile-name" id="nomeUsuario"></p>
        </div>
    </main>

    <script type="module">
        import { Usuario } from "../Modelos/ModeloUsuario.js"

        window.addEventListener("DOMContentLoaded", async () => {
            await Usuario.pegarFoto()
            const token = localStorage.getItem("token");
            const nome = localStorage.getItem("nome_usuario")
            document.getElementById("nomeUsuario").innerText = nome

            if (!token) {
                window.location.href = "login.html";
            }
        });

        inputFoto.onchange = async () => {
            const file = inputFoto.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append("foto", file);

            const resposta = await Usuario.uploadFoto(formData);
            await Usuario.pegarFoto();

            // Atualiza preview
            const reader = new FileReader();
            reader.onload = () => {
                document.getElementById("fotoImg").src = reader.result;
            };
            reader.readAsDataURL(file);
        };
    </script>
</body>
</html>
